name: work_time_billing_manager
description: Offline-first work time and billing manager.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  fl_chart: ^0.69.2
  pdf: ^3.11.3
  printing: ^5.14.2
  excel: ^4.0.6
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.4.0
  uuid: ^4.5.1
  csv: ^6.0.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
